appId: com.permutation.desktop
productName: Permutation
copyright: Copyright © 2026 Permutation contributors

directories:
  output: ../../release
  buildResources: resources

# The renderer and main bundles are self-contained; native modules come from
# the workspace node_modules and are unpacked from the asar archive.
files:
  - out/**/*
  - resources/**/*
  - package.json

asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*

# Native modules are rebuilt for the Electron ABI by `npm run rebuild:native`
# (part of postinstall). Do not let electron-builder fetch a different binary.
npmRebuild: false

mac:
  category: public.app-category.productivity
  icon: resources/icon.png
  target:
    - target: dmg
      arch:
        - arm64
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSUserNotificationUsageDescription: Permutation uses notifications for reminders you create.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

publish: null
